name: Build Production Lines Tracker Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Required for Capacitor 6 / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: |
          npm run build
          test -f dist/index.html
          ls -la dist

      - name: Install Capacitor 6 Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create fresh Android project and sync dist/ bundle
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Enable hardware acceleration & safe status bar color
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:hardwareAccelerated="true"' "$MANIFEST"; then
            sed -i 's/<application /<application android:hardwareAccelerated="true" /' "$MANIFEST"
          fi
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ] && ! grep -q 'android:statusBarColor' "$STYLES"; then
            sed -i 's|</style>|        <item name="android:statusBarColor">#0F766E</item>\n    </style>|' "$STYLES"
          fi
          grep -n 'app_name' android/app/src/main/res/values/strings.xml || true

      - name: Apply Production Lines Tracker launcher icon
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                [ -f "$dir/ic_launcher.png" ] && cp public/pwa-512x512.png "$dir/ic_launcher.png"
                [ -f "$dir/ic_launcher_round.png" ] && cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
                [ -f "$dir/ic_launcher_foreground.png" ] && cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png"
              fi
            done
            if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
              sed -i 's/#[0-9A-Fa-f]\{6\}/#0F766E/g' android/app/src/main/res/values/ic_launcher_background.xml
            fi
          fi

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare final APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/production-lines-tracker.apk
          ls -lh release-apk/production-lines-tracker.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-lines-tracker-apk
          path: release-apk/production-lines-tracker.apk
          retention-days: 30

      - name: Publish 1-Tap Direct Download to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="production-lines-tracker-apk-latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" release-apk/production-lines-tracker.apk \
            --title "متابع خطوط الإنتاج — تطبيق الأندرويد الكامل (APK)" \
            --notes "تطبيق متابع خطوط الإنتاج للأندرويد (40 عامل): جدول أسبوعي لتسجيل شغل العمال يوم بيوم (الانتينال 18، الابيدون 20، الانماكس تعبئة وتغليف 24، تمبر الانماكس 8، بي بي سي 12، خط النقط 5، الطباعة، التغليف اليدوي، قسم الأقراص، قسم الفوار، الغياب والإجازات)، تسجيل اليوم السريع، التوزيع العادل حسب طاقة كل خط، الشغل على خطين (نص+نص) وساعات الإضافي، ملخص الحساب التلقائي، وتقارير واتساب و Excel — يعمل أوفلاين بالكامل."
